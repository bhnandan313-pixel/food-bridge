services:
  # ─── Backend: Flask API ───────────────────────────────────────────────────────
  - type: web
    name: foodbridge-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: SECRET_KEY
        generateValue: true       # Render auto-generates a secure random value
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /health

  # ─── Frontend: React + Vite (Static Site) ────────────────────────────────────
  - type: web
    name: foodbridge-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html   # Required for React Router (SPA)
    envVars:
      - key: VITE_API_URL
        value: https://foodbridge-backend.onrender.com   # Update after first deploy
      - key: NODE_VERSION
        value: 20.11.0
